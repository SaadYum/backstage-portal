openapi: 3.0.3
info:
  title: publisher-service API
  version: 1.0.0
  description: Machine-readable HTTP contract for the publishing platform content lifecycle service.
servers:
  - url: http://localhost:4000/api/v1
security:
  - BearerAuth: []
tags:
  - name: content
  - name: health
paths:
  /content:
    get:
      tags: [content]
      summary: List content items
      operationId: listContent
      responses:
        '200':
          description: Paginated content list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentListResponse'
    post:
      tags: [content]
      summary: Create a content item
      operationId: createContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentCreateRequest'
      responses:
        '201':
          description: Content item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /content/{id}:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [content]
      summary: Retrieve a content item
      operationId: getContent
      responses:
        '200':
          description: Content item returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '404':
          description: Content item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [content]
      summary: Replace a content item
      operationId: replaceContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentUpdateRequest'
      responses:
        '200':
          description: Content item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
    patch:
      tags: [content]
      summary: Partially update a content item
      operationId: patchContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentPatchRequest'
      responses:
        '200':
          description: Content item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
    delete:
      tags: [content]
      summary: Delete a content item
      operationId: deleteContent
      responses:
        '204':
          description: Content item deleted
  /content/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    post:
      tags: [content]
      summary: Trigger the publish pipeline
      operationId: publishContent
      responses:
        '202':
          description: Publish job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishJob'
  /content/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ContentId'
    get:
      tags: [content]
      summary: Get current pipeline status
      operationId: getContentStatus
      responses:
        '200':
          description: Current publish status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishJob'
  /health:
    get:
      tags: [health]
      security: []
      summary: Liveness probe
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ContentId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    ContentItem:
      type: object
      required: [id, title, status, owner, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        tags:
          type: array
          items:
            type: string
        scheduledAt:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, queued, published, failed]
        owner:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ContentCreateRequest:
      type: object
      required: [title, body, tags]
      properties:
        title:
          type: string
        body:
          type: string
        tags:
          type: array
          items:
            type: string
        scheduledAt:
          type: string
          format: date-time
          nullable: true
    ContentUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ContentCreateRequest'
    ContentPatchRequest:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        tags:
          type: array
          items:
            type: string
        scheduledAt:
          type: string
          format: date-time
          nullable: true
    PublishJob:
      type: object
      required: [jobId, contentId, status]
      properties:
        jobId:
          type: string
        contentId:
          type: string
        status:
          type: string
          enum: [queued, running, published, failed]
        estimatedCompletionSeconds:
          type: integer
    HealthStatus:
      type: object
      required: [status, uptime, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        uptime:
          type: integer
        version:
          type: string
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true
